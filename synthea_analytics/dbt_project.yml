# =============================================================================
# dbt_project.yml - Synthea healthcare analytics (dbt v2 on Snowflake; dbt Core 1.12 compatible)
# Author: Cortwright Grant
#
# Layers (medallion):  RAW (loaded outside dbt)  ->  STAGING  ->  INTERMEDIATE  ->  MARTS
# Each layer builds into the Snowflake schema of the same name. See
# macros/generate_schema_name.sql for why custom schemas are used verbatim.
# =============================================================================
name: synthea_analytics
version: "0.1.0"
config-version: 2
require-dbt-version: [">=1.12.0", "<3.0.0"]   # dbt v2 primary, dbt Core 1.12 fallback

profile: synthea            # matches the profile name in ~/.dbt/profiles.yml

model-paths:    ["models"]
analysis-paths: ["analyses"]
test-paths:     ["tests"]
seed-paths:     ["seeds"]
macro-paths:    ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false
  # Both required by Tuva Core 1.0. The first makes ref('patient') inside the
  # Tuva package resolve to this project's Input Layer models.
  require_ref_searches_node_package_before_root: true
  require_generic_test_arguments_property: true

vars:
  # ---- Tuva Core (see packages.yml) ----------------------------------------
  # Feature switches must be native YAML booleans, never quoted strings.
  clinical_enabled: true    # this project maps the clinical Input Layer
  # claims_enabled is left unset (= false) until the claims mapping exists.
  # Tuva builds into its own schemas. The prefix keeps them apart from this
  # project's STAGING / INTERMEDIATE / MARTS: TUVA_CORE, TUVA_TERMINOLOGY, ...
  # SYNTHEA_DBT_ROLE cannot create schemas, so each one is pre-created in
  # snowflake/07_tuva_schemas.sql.
  tuva_schema_prefix: tuva

models:
  synthea_analytics:
    +persist_docs:          # push model/column descriptions into Snowflake comments
      relation: true
      columns: true

    tuva_input_layer:       # one model per Tuva Input Layer table, named as Tuva expects
      +schema: TUVA_INPUT_LAYER
      +materialized: table
      +tags: ["input_layer"]

    staging:                # stg_*: 1:1 with a RAW table; rename, cast, light cleanup
      +schema: STAGING
      +materialized: view

    intermediate:           # int_*: joins and business logic reused by marts
      +schema: INTERMEDIATE
      +materialized: view

    marts:                  # dim_* / fct_*: star schema for analysts
      +schema: MARTS
      +materialized: table

seeds:
  the_tuva_project:
    synthetic_data:
      +enabled: false       # Tuva's own demo dataset; this project maps real source tables instead

data_tests:
  synthea_analytics:
    +store_failures: false  # flip to true when you want failing rows kept for triage
